[project]
name = "fastlp-py"
version = "0.2.0"
description = "Faster panel local projections for applied macroeconomists."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [
    { name = "Ritwiz Sarma", email = "ritwiz.sarma@cafral.org.in" },
]
keywords = [
    "econometrics",
    "local projections",
    "panel data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
polars = ["polars>=1.43"]

[project.urls]
Homepage = "https://ritwizsarma.github.io/fastLP/"
Repository = "https://github.com/RitwizSarma/fastLP"
Issues = "https://github.com/RitwizSarma/fastLP/issues"
Documentation = "https://ritwizsarma.github.io/fastLP/"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "fastlp._fastlp_rust"
python-source = "src"
bindings = "pyo3"
strip = true
include = [
    { path = "rust/Cargo.lock", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
    { path = "LICENSES/diff-diff-MIT.txt", format = "sdist" },
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "linearmodels>=7.0",
    "pytest>=8.0",
    "statsmodels>=0.14",
    "twine>=7.0.0",
]
docs = [
    "myst-parser>=5.1.0",
    "pydata-sphinx-theme>=0.20.0",
    "sphinx>=9.1.0",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
