[project]
name = "fastlp"
version = "0.1.0"
description = "Fast local projections for balanced and unbalanced panel data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "fastlp._fastlp_rust"
python-source = "src"
bindings = "pyo3"
strip = true
include = [
    { path = "rust/Cargo.lock", format = "sdist" },
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
