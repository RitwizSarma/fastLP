[project]
name = "fastlp"
version = "0.1.0"
description = "Fast local projections for balanced and unbalanced panel data"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt"]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "fastlp._fastlp_rust"
python-source = "src"
bindings = "pyo3"
strip = true
include = [
    { path = "rust/Cargo.lock", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
    { path = "LICENSES/diff-diff-MIT.txt", format = "sdist" },
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
